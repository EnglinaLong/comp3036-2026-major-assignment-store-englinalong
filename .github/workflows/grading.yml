name: Full Stack Store Grading

on:
  push:
  workflow_dispatch:

permissions:
  actions: read
  checks: write
  contents: read

jobs:
  run-full-stack-store-checks:
    name: Full Stack Store Checks
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: full_stack_store_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d full_stack_store_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CI: true
      COURSE_ID: full-stack-development-comp3036-2026
      TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/full_stack_store_test?schema=public"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/full_stack_store_test?schema=public"
      E2E: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JWT_SECRET: secret
      PASSWORD: 123
      SKIP_ENV_VALIDATION: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Add Turbo to PATH
        run: echo "${{ github.workspace }}/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install Playwright browsers
        working-directory: tests/playwright
        run: pnpm exec playwright install chromium --with-deps

      - name: Prepare database
        run: pnpm --filter @repo/db db:push

      - name: Full Stack Store - Build
        id: build
        uses: WesternSydneyUniversity/autograding-command-grader@v2
        continue-on-error: true
        with:
          working-directory: .
          test-name: Full Stack Store - Build
          command: turbo build
          timeout: 15
          max-score: 1

      - name: Full Stack Store - User Storefront Tests
        id: storefront
        uses: WesternSydneyUniversity/autograding-command-grader@v2
        continue-on-error: true
        with:
          working-directory: .
          test-name: Full Stack Store - User Storefront Tests
          command: turbo test-1
          timeout: 15
          max-score: 1

      - name: Report storefront tests to SkillPies
        if: always()
        continue-on-error: true
        uses: tomitrescak/skillpies-reporting@v1.0
        with:
          courseId: ${{ env.COURSE_ID }}
          sectionId: full-stack-store-user-storefront-tests
          testResult: ${{ steps.storefront.outputs.result }}

      - name: Full Stack Store - Admin Store Tests
        id: admin
        uses: WesternSydneyUniversity/autograding-command-grader@v2
        continue-on-error: true
        with:
          working-directory: .
          test-name: Full Stack Store - Admin Store Tests
          command: turbo test-2
          timeout: 15
          max-score: 1

      - name: Report admin tests to SkillPies
        if: always()
        continue-on-error: true
        uses: tomitrescak/skillpies-reporting@v1.0
        with:
          courseId: ${{ env.COURSE_ID }}
          sectionId: full-stack-store-admin-store-tests
          testResult: ${{ steps.admin.outputs.result }}

      - name: Autograding Reporter
        uses: education/autograding-grading-reporter@v1
        env:
          ADMIN_RESULTS: "${{ steps.admin.outputs.result }}"
          BUILD_RESULTS: "${{ steps.build.outputs.result }}"
          STOREFRONT_RESULTS: "${{ steps.storefront.outputs.result }}"
        with:
          runners: build,storefront,admin
